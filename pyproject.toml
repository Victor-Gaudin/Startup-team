[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropkit"
version = "0.1.0"
description = "Self-hosted eBay listing automation: supplier import, AI listings, pricing, publishing, order sync and price monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "httpx2>=2.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dropkit = "dropkit.cli:app"

[tool.setuptools.packages.find]
include = ["dropkit*"]

[tool.setuptools.package-data]
dropkit = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
